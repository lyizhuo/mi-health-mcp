[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mi-health-mcp"
version = "0.1.0"
description = "Local-first Xiaomi health data hub for agents: REST + MCP + scheduled sync"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "mcp>=1.30,<2",
  "pydantic>=2.7",
  "cryptography>=42",
  "argon2-cffi>=23",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
mi-health = "mi_health.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_health"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
